<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Keyboard Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/midi-player-js@2.0.16/browser/midiplayer.min.js"></script>
    <!-- VexFlow for staff notation -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #audio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        #audio-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .start-btn {
            padding: 20px 40px;
            font-size: 1.5rem;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-btn:disabled {
            background: #333;
            color: #666;
            cursor: wait;
            box-shadow: none;
        }

        .start-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.6);
        }

        .main-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #050505;
        }

        .viz-area {
            flex-grow: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-top: 80px;
            /* Space for top-bar */
        }

        #visualizer-canvas {
            width: 100%;
            height: 100%;
            background: transparent;
            display: block;
        }

        .keyboard-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #111;
            padding: 10px 0 20px 0;
            z-index: 10;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
            overflow-x: auto;
        }

        .keyboard {
            display: flex;
            position: relative;
            background: #222;
            padding: 5px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
        }

        .key {
            width: 35px;
            height: 160px;
            background: linear-gradient(to bottom, #fff 0%, #eee 90%, #ddd 100%);
            border: 1px solid #aaa;
            border-radius: 0 0 4px 4px;
            cursor: pointer;
            position: relative;
            transition: background 0.05s, transform 0.05s;
            box-sizing: border-box;
        }

        .key.black {
            width: 20px;
            height: 100px;
            background: linear-gradient(to bottom, #333 0%, #000 100%);
            margin-left: -10px;
            margin-right: -10px;
            z-index: 2;
            border: 1px solid #000;
        }

        .key.active {
            background: #00ffcc !important;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.2), 0 0 25px #00ffcc;
            transform: translateY(2px);
        }

        .key.black.active {
            background: #00ccaa !important;
        }

        .top-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none;
        }

        .info-panel {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
        }

        .status {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00ffcc;
            margin-bottom: 5px;
        }

        .note-display {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
        }

        .tempo-controls {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
        }

        .tempo-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ffcc;
            display: flex;
            justify-content: space-between;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        .drop-zone-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            pointer-events: auto;
            cursor: pointer;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            transition: all 0.3s;
            z-index: 50;
        }

        .drop-zone-hint:hover {
            color: #00ffcc;
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.05);
        }

        body.dragging .drop-zone-hint {
            color: #00ffcc;
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.05);
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* New Control Bar Styles */
        .top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            height: 60px;
            background: #151b33;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
            z-index: 200;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            user-select: none;
            pointer-events: auto;
        }

        .bar-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #252e4d;
            border: none;
            color: #7a88b5;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            font-size: 1.2rem;
        }

        .bar-btn:hover {
            color: #fff;
            background: #303b61;
        }

        .bar-btn.active {
            color: #00ffcc;
            background: #1e3a4d;
        }

        .tempo-box {
            display: flex;
            align-items: center;
            background: #1e2642;
            border-radius: 8px;
            height: 40px;
            padding: 0 5px;
            gap: 5px;
            min-width: 140px;
        }

        .tempo-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            line-height: 1;
        }

        .tempo-pct {
            font-size: 0.9rem;
            font-weight: bold;
            color: #7a88b5;
        }

        .tempo-bpm {
            font-size: 0.7rem;
            color: #55608a;
            margin-top: 2px;
        }

        .progress-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
            height: 40px;
            border-radius: 8px;
            padding: 0 15px;
        }

        .time-label {
            font-family: monospace;
            font-size: 0.8rem;
            color: #7a88b5;
            min-width: 45px;
        }

        #progress-bar {
            flex-grow: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #1e2642;
            border-radius: 2px;
            outline: none;
            border: none;
        }

        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #00ffcc;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            border: none;
        }

        #progress-bar::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #00ffcc;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            border: none;
        }

        #progress-bar::-moz-range-track {
            background: #1e2642;
            height: 4px;
            border-radius: 2px;
        }

        .volume-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e2642;
            border-radius: 8px;
            height: 40px;
            padding: 0 12px;
            min-width: 150px;
        }

        #volume-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #252e4d;
            border-radius: 2px;
            border: none;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: #7a88b5;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        #volume-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            background: #7a88b5;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        #volume-slider::-moz-range-track {
            background: #252e4d;
            height: 4px;
            border-radius: 2px;
        }

        .progress-container {
            flex-grow: 1;
            height: 40px;
            position: relative;
            display: flex;
            align-items: center;
            margin: 0;
            padding: 0 6px;
            box-sizing: border-box;
        }

        .loop-box {
            position: absolute;
            height: 30px;
            background: rgba(255, 165, 0, 0.5);
            pointer-events: auto;
            z-index: 1;
            /* Behind the progress bar thumb */
            border-radius: 4px;
            display: none;
            cursor: move;
        }

        .loop-handle {
            position: absolute;
            width: 6px;
            height: 30px;
            background: #ffa500;
            cursor: ew-resize;
            z-index: 15;
            /* On top for dragging */
            border-radius: 3px;
            transform: translateX(-50%);
            display: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .loop-handle:hover {
            background: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.8);
        }

        #progress-bar {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #1e2642;
            border-radius: 2px;
            outline: none;
            border: none;
            z-index: 10;
            /* Above the loop-box */
        }

        .side-scale-container {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 36px;
            /* Explicit narrow width */
            background: rgba(21, 27, 51, 0.7);
            padding: 20px 0;
            border-radius: 18px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 250;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .v-scale-label {
            font-size: 0.6rem;
            color: #7a88b5;
            text-transform: uppercase;
            letter-spacing: 1px;
            writing-mode: vertical-lr;
            transform: rotate(180deg);
        }

        #v-scale-slider,
        #side-scale-container .v-slider-common {
            -webkit-appearance: none;
            appearance: none;
            width: 180px;
            /* Height when vertical */
            height: 2px;
            background: #252e4d;
            outline: none;
            transform: rotate(-90deg);
            margin: 90px 0;
            /* (width/2) to prevent expansion */
            cursor: pointer;
        }

        #v-scale-slider::-webkit-slider-thumb,
        #side-scale-container .v-slider-common::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #00ffcc;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        /* Sound Pack Selector */
        .sound-pack-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e2642;
            border-radius: 8px;
            height: 40px;
            padding: 0 12px;
        }

        #sound-pack-select {
            background: #252e4d;
            color: #fff;
            border: 1px solid #3a4570;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
            min-width: 140px;
            transition: all 0.2s;
        }

        #sound-pack-select:hover {
            border-color: #00ffcc;
            background: #303b61;
        }

        #sound-pack-select:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }

        #sound-pack-select option {
            background: #1e2642;
            color: #fff;
            padding: 8px;
        }

        #sound-pack-select optgroup {
            background: #151b33;
            color: #00ffcc;
            font-weight: bold;
            font-style: normal;
        }

        .sound-loading {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        #staff-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ffffff !important;
            /* LIGHT MODE for staff only */
            z-index: 5;
            display: flex;
            align-items: center;
            /* Center staff vertically */
            justify-content: flex-start;
            overflow: hidden;
            /* We will use JS for scrolling */
        }

        #staff-scroll-area {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            /* Container for the SVG and loop bars */
            will-change: transform;
        }

        #staff-container.hidden {
            display: none;
        }

        #staff-container svg {
            background: transparent;
        }

        /* Standard notation colors (black on white) */
        #staff-container svg .vf-stave line,
        #staff-container svg .vf-stave path {
            stroke: #000 !important;
        }

        /* Playhead indicator - FIXED AT CENTER */
        .staff-playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            background: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
            z-index: 20;
            pointer-events: none;
            transform: translateX(-50%);
            display: none;
            /* Only show in staff mode */
        }

        /* Sticky Clef Overlay */
        #clef-overlay {
            position: absolute;
            top: 50%;
            left: 0;
            width: 80px;
            height: 280px;
            background: #ffffff;
            z-index: 25;
            pointer-events: none;
            border-right: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            transform: translateY(-50%);
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.05);
        }

        #clef-overlay.hidden {
            display: none;
        }

        /* Staff Loop Bars */
        .staff-loop-bar {
            position: absolute;
            top: 20px;
            bottom: 30px;
            width: 4px;
            background: rgba(255, 165, 0, 0.6);
            border: 1px solid #ffaa00;
            z-index: 15;
            pointer-events: none;
            border-radius: 2px;
        }

        /* View toggle active state */
        #view-toggle-btn.staff-active {
            background: linear-gradient(135deg, #ff8800 0%, #ff5500 100%);
            box-shadow: 0 0 15px rgba(255, 136, 0, 0.5);
        }
    </style>
</head>

<body>
    <div id="audio-overlay">
        <h1 style="margin-bottom: 10px; font-weight: 300;">Synthesia Web Synth</h1>
        <p id="loading-text" style="color: #00ffcc; margin-bottom: 30px; font-family: monospace;">LOADING SOUND
            SAMPLES...</p>
        <button class="start-btn" id="start-btn" disabled>PLEASE WAIT...</button>
    </div>

    <div class="main-container">
        <div class="top-bar">
            <!-- Play/Pause -->
            <button class="bar-btn" id="play-pause-btn">▶</button>

            <!-- Progress -->
            <div class="progress-wrapper">
                <span class="time-label" id="current-time">0:00</span>
                <div class="progress-container" id="progress-container">
                    <div id="loop-box" class="loop-box"></div>
                    <div id="loop-handle-start" class="loop-handle" title="Loop Start"></div>
                    <div id="loop-handle-end" class="loop-handle" title="Loop End"></div>
                    <input type="range" id="progress-bar" min="0" max="1000" value="0">
                </div>
                <span class="time-label" id="total-time">0:00</span>
            </div>

            <!-- Volume -->
            <div class="volume-wrapper">
                <div id="status"
                    style="position: absolute; top: calc(100% + 5px); left: 0; font-size: 0.7rem; color: #7a88b5; white-space: nowrap; pointer-events: none;">
                    Ready</div>
                <div id="note-display"
                    style="position: absolute; top: calc(100% + 15px); left: 50%; transform: translateX(-50%); font-size: 1.5rem; font-weight: bold; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5); pointer-events: none;">
                    -</div>
                <span style="color: #7a88b5; font-size: 1.2rem;">🔊</span>
                <input type="range" id="volume-slider" min="0" max="100" value="80">
            </div>

            <!-- Sound Pack -->
            <div class="sound-pack-wrapper">
                <span style="color: #7a88b5; font-size: 1rem;">🎵</span>
                <select id="sound-pack-select" title="Sound Pack">
                    <optgroup label="🎹 Piano">
                        <option value="acoustic_grand_piano" selected>Acoustic Grand</option>
                        <option value="bright_acoustic_piano">Bright Piano</option>
                        <option value="honkytonk_piano">Honky Tonk</option>
                    </optgroup>
                    <optgroup label="⚡ Electric Piano">
                        <option value="electric_piano_1">Electric Piano 1</option>
                        <option value="electric_piano_2">Electric Piano 2</option>
                        <option value="electric_grand_piano">Electric Grand</option>
                    </optgroup>
                    <optgroup label="🎛️ Keyboard">
                        <option value="harpsichord">Harpsichord</option>
                        <option value="clavinet">Clavinet</option>
                        <option value="celesta">Celesta</option>
                    </optgroup>
                    <optgroup label="🎚️ Synth">
                        <option value="pad_1_new_age">Pad (New Age)</option>
                        <option value="pad_2_warm">Pad (Warm)</option>
                        <option value="lead_1_square">Lead (Square)</option>
                        <option value="lead_2_sawtooth">Lead (Sawtooth)</option>
                    </optgroup>
                    <optgroup label="🎉 Fun">
                        <option value="music_box">Music Box</option>
                        <option value="vibraphone">Vibraphone</option>
                        <option value="marimba">Marimba</option>
                        <option value="steel_drums">Steel Drums</option>
                        <option value="church_organ">Church Organ</option>
                    </optgroup>
                </select>
            </div>

            <!-- Tempo -->

            <div class="tempo-box">
                <button class="bar-btn" style="background:transparent; width:30px" id="tempo-minus">−</button>
                <div class="tempo-display">
                    <span class="tempo-pct" id="tempo-val">100%</span>
                    <span class="tempo-bpm" id="tempo-bpm-val">120 bpm</span>
                </div>
                <button class="bar-btn" style="background:transparent; width:30px" id="tempo-plus">+</button>
            </div>

            <!-- Practice Mode -->
            <button class="bar-btn" id="wait-btn" title="Wait for Piano">🎹</button>

            <!-- Mute MIDI File -->
            <button class="bar-btn" id="mute-midi-btn" title="Mute MIDI File">🔇</button>

            <!-- View Toggle (Falling Notes / Staff) -->
            <button class="bar-btn" id="view-toggle-btn" title="Toggle Staff View">🎼</button>

            <!-- Extra Tools -->
            <div class="right-tools">
                <button class="bar-btn" id="settings-btn" title="Select MIDI File">📂</button>
            </div>
        </div>

        <!-- Vertical Scale Slider -->
        <div class="side-scale-container" id="side-scale-container">
            <span class="v-scale-label" style="margin-bottom: 80px;">SCALE</span>
            <input type="range" id="v-scale-slider" min="1" max="100" value="50">

            <div style="height: 100px;"></div> <!-- Spacer -->

            <span class="v-scale-label" style="margin-bottom: 80px;">LEEWAY</span>
            <!-- Range 0-30ms, Default 15ms -->
            <input type="range" id="leeway-slider" min="0" max="30" value="15" class="v-slider-common">
            <span id="leeway-val"
                style="margin-top: 20px; font-size: 0.7rem; color: #00ffcc; font-family: monospace;">15ms</span>

            <!-- Debug Pending Notes -->
            <div id="pending-notes-display"
                style="margin-top: 40px; font-size: 0.8rem; color: #ff5555; text-align: center; font-family: monospace; writing-mode: vertical-lr; transform: rotate(180deg);">
            </div>
        </div>

        <!-- Start Button Overlay -->

        <div class="drop-zone-hint" id="drop-hint">
            Click or Drop MIDI file here
        </div>
        <input type="file" id="midi-input" accept=".mid,.midi" style="display: none;">

        <!-- Main Visualization Area -->
        <div class="viz-area">
            <canvas id="visualizer-canvas"></canvas>

            <!-- Staff Notation Container -->
            <div id="staff-container" class="hidden">
                <div id="staff-scroll-area">
                    <!-- SVG will be rendered here -->
                </div>

                <!-- Loop bars inside the relative container but outside the scroll-area for fixed positioning? 
                      No, loop bars should scroll WITH the staff. -->
                <div id="staff-loop-start" class="staff-loop-bar" style="display:none;"></div>
                <div id="staff-loop-end" class="staff-loop-bar" style="display:none;"></div>
            </div>

            <!-- Fixed Overlay Elements -->
            <div id="clef-overlay" class="hidden"></div>
            <div class="staff-playhead" id="staff-playhead-v2"></div>
        </div>

        <div class="keyboard-container">
            <div class="keyboard" id="keyboard">
                <!-- Keys will be generated by JS -->
            </div>
        </div>
    </div>

    <script>
        const socket = io({
            transports: ['websocket', 'polling'],
            upgrade: true,
            rememberUpgrade: true
        });
        const keyboard = document.getElementById('keyboard');
        const status = document.getElementById('status');
        const noteDisplay = document.getElementById('note-display');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('audio-overlay');
        const loadingText = document.getElementById('loading-text');
        const canvas = document.getElementById('visualizer-canvas');
        const ctx = canvas.getContext('2d');
        const dropHint = document.getElementById('drop-hint');
        const midiInput = document.getElementById('midi-input');

        // Audio & Player Variables
        let audioContext = null;
        let piano = null;
        let audioReady = false;
        let player = null;
        let isSustainActive = false;
        const activeNotes = new Map(); // note -> { player }
        const sustainedNotes = new Set();
        let fallingNotes = []; // { note, startTick, endTick }

        // Playback & Looping State
        let loopStartTick = null;
        let loopEndTick = null;
        let isWaitMode = false;
        let isMidiMuted = false;
        let pendingNotes = new Set();
        let isUserSeeking = false;
        let lastSeekTime = 0;

        const pendingNotesDisplay = document.getElementById('pending-notes-display');

        // Leeway settings for practice mode
        let LEEWAY_MS = 100;
        const recentUserNotes = new Map(); // note -> timestamp
        let leewayCollecting = false;
        let leewayTimeout = null;

        function updatePendingDisplay() {
            if (!pendingNotesDisplay) return;
            if (pendingNotes.size === 0) {
                pendingNotesDisplay.innerText = '';
                return;
            }
            const names = Array.from(pendingNotes).map(n => notes[n % 12] + (Math.floor(n / 12) - 1));
            pendingNotesDisplay.innerText = 'WAIT: ' + names.join(', ');
        }

        let masterVolume = 0.8;
        let currentTempoPct = 100;
        let visualScale = 1.0; // Multiplier for TICKS_PER_PIXEL

        // Config
        let TICKS_PER_PIXEL = 10; // Initial value, will be calibrated on load
        const KEYBOARD_LINE_Y = 0; // Relative to bottom of canvas

        // Resize Canvas
        function recalibrate() {
            if (player && player.division) {
                TICKS_PER_PIXEL = (player.division * 4) / canvas.height;
            }
        }
        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            recalibrate();
            // Update loop UI on resize since it uses pixel-based positioning
            if (typeof updateLoopUI === 'function') updateLoopUI();
        }
        window.onresize = resize;
        resize();

        // Initialize Piano
        const soundPackSelect = document.getElementById('sound-pack-select');
        const instrumentCache = new Map(); // Cache loaded instruments
        let currentInstrumentName = 'acoustic_grand_piano';

        async function loadInstrument(instrumentName) {
            // Check cache first
            if (instrumentCache.has(instrumentName)) {
                return instrumentCache.get(instrumentName);
            }

            // Load new instrument
            const instrument = await Soundfont.instrument(audioContext, instrumentName, {
                soundfont: 'FluidR3_GM'
            });
            instrumentCache.set(instrumentName, instrument);
            return instrument;
        }

        async function switchSoundPack(instrumentName) {
            if (!audioContext) return;

            // Show loading state
            soundPackSelect.classList.add('sound-loading');
            soundPackSelect.disabled = true;

            try {
                const newInstrument = await loadInstrument(instrumentName);

                // Stop any currently playing notes from old instrument
                activeNotes.forEach((noteData, noteNum) => {
                    if (noteData.player && noteData.player.stop) {
                        noteData.player.stop();
                    }
                });
                activeNotes.clear();
                sustainedNotes.clear();

                piano = newInstrument;
                currentInstrumentName = instrumentName;
                console.log('Switched to:', instrumentName);
            } catch (err) {
                console.error('Failed to load instrument:', err);
                // Revert selection on error
                soundPackSelect.value = currentInstrumentName;
            } finally {
                soundPackSelect.classList.remove('sound-loading');
                soundPackSelect.disabled = false;
            }
        }

        async function initPiano() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const selectedInstrument = soundPackSelect.value || 'acoustic_grand_piano';
                piano = await loadInstrument(selectedInstrument);
                currentInstrumentName = selectedInstrument;
                audioReady = true;
                startBtn.disabled = false;
                startBtn.innerText = 'START EXPERIENCE';
                loadingText.innerText = 'SOUNDS LOADED';
            } catch (err) {
                console.error('Failed to load piano:', err);
                loadingText.innerText = 'ERROR LOADING SOUNDS';
            }
        }
        initPiano();

        // Sound pack change handler
        soundPackSelect.addEventListener('change', async (e) => {
            await switchSoundPack(e.target.value);
        });


        startBtn.onclick = async () => {
            if (audioContext && audioContext.state === 'suspended') await audioContext.resume();
            overlay.classList.add('hidden');
            status.innerText = 'Ready to play';
        };

        // Generate Keyboard
        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const startMIDI = 21;
        const endMIDI = 108;
        const keysMap = {};
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const loopBox = document.getElementById('loop-box');
        const loopHandleStart = document.getElementById('loop-handle-start');
        const loopHandleEnd = document.getElementById('loop-handle-end');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const waitBtn = document.getElementById('wait-btn');
        const muteMidiBtn = document.getElementById('mute-midi-btn');
        const tempoVal = document.getElementById('tempo-val');
        const tempoBpmVal = document.getElementById('tempo-bpm-val');
        const tempoPlus = document.getElementById('tempo-plus');
        const tempoMinus = document.getElementById('tempo-minus');
        const volumeSlider = document.getElementById('volume-slider');
        const settingsBtn = document.getElementById('settings-btn');

        // Note Highlight Utility
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        for (let i = startMIDI; i <= endMIDI; i++) {
            const isBlack = notes[i % 12].includes('#');
            const key = document.createElement('div');
            key.className = `key ${isBlack ? 'black' : 'white'}`;
            key.dataset.note = i;
            keyboard.appendChild(key);
            keysMap[i] = key;
        }

        // MIDI Player Setup
        player = new MidiPlayer.Player((event) => {
            try {
                if (event.name === 'Note on') {
                    // Ignore out-of-range notes for Wait Mode (user can't play them)
                    const isPlayable = event.noteNumber >= startMIDI && event.noteNumber <= endMIDI;

                    if (isWaitMode && event.velocity > 0 && isPlayable) {
                        // Check if user ALREADY played this note recently (Leeway Before)
                        const now = Date.now();
                        const userTime = recentUserNotes.get(event.noteNumber);

                        if (userTime && (now - userTime) <= LEEWAY_MS) {
                            // Note was already played by user within leeway window
                            recentUserNotes.delete(event.noteNumber);
                        } else {
                            pendingNotes.add(event.noteNumber);
                            updatePendingDisplay();
                            // Pause IMMEDIATELY to prevent drift
                            if (isWaitMode) {
                                player.pause();
                                playPauseBtn.innerText = '▶';
                            }
                        }
                    }
                    if (event.velocity > 0) {
                        updateKeyState('note_on', event.noteNumber, event.velocity, null, null, true);
                    } else {
                        updateKeyState('note_off', event.noteNumber, 0, null, null, true);
                    }
                } else if (event.name === 'Note off') {
                    updateKeyState('note_off', event.noteNumber, 0, null, null, true);
                } else if (event.name === 'Controller Change' && event.number === 64) {
                    updateKeyState('control_change', null, null, 64, event.value, true);
                } else if (event.name === 'Set Tempo') {
                    // Handle dynamic tempo changes in the song while preserving user multiplier
                    player._baseTempo = event.data;
                    updateTempo(currentTempoPct);
                }

                // Loop Logic
                if (loopEndTick !== null && player.tick >= loopEndTick) {
                    console.log(`Player Event Loop Trigger: Tick ${player.tick} >= ${loopEndTick}`);
                    player.skipToTick(loopStartTick || 0);
                    player.play();
                    playPauseBtn.innerText = '⏸';
                }
            } catch (err) { console.error("Player Event Error:", err, event); }
        });

        player.on('endOfFile', () => {
            console.log('End of File reached.');
            // Ensure we loop if needed, even if we missed the tick check
            if (loopEndTick !== null) {
                player.skipToTick(loopStartTick || 0);
                player.play();
            }
        });

        // Loop polling for smooth progress bar and loop check
        setInterval(() => {
            const now = Date.now();
            if (player && player.totalTicks > 0) {
                // Only update progress bar thumb if playing and not recently seeking
                if (player.isPlaying() && !isUserSeeking && (now - lastSeekTime > 1000)) {
                    const progress = (player.tick / player.totalTicks) * 1000;
                    progressBar.value = progress;
                }

                currentTimeEl.innerText = formatTime(player.tick * (player.getSongTime() / player.totalTicks));
                totalTimeEl.innerText = formatTime(player.getSongTime());

                if (player.isPlaying()) {
                    // Loop check logic moved to animate loop for higher precision
                    // but we keep a fallback here
                    if (loopEndTick !== null && player.tick >= loopEndTick) {
                        // Only loop if loopEndTick is valid
                        console.log(`Loop Triggered at ${player.tick} (End: ${loopEndTick})`);
                        player.skipToTick(loopStartTick || 0);
                        player.play();
                    }

                    // Watchdog: If playing but tick stuck > 2s? 
                    // (Requires tracking last tick)
                    if (!player._lastTickCheckTime) player._lastTickCheckTime = now;
                    if (!player._lastTickValue) player._lastTickValue = player.tick;

                    if (now - player._lastTickCheckTime > 2000) {
                        if (player.isPlaying() && player.tick === player._lastTickValue && !isWaitMode && !isUserSeeking) {
                            console.warn("Watchdog: Playback appears stuck. Attempting resume.");
                            try {
                                if (audioContext.state === 'suspended') audioContext.resume();
                                player.play();
                            } catch (e) { console.error("Watchdog Resume Failed", e); }
                        }
                        player._lastTickCheckTime = now;
                        player._lastTickValue = player.tick;
                    }
                }
            }
        }, 50);

        function updateTempo(pct) {
            currentTempoPct = pct;
            const baseBpm = player._baseTempo || 120;
            const newBpm = Math.round(baseBpm * (pct / 100));
            player.setTempo(newBpm);
            player.tempo = newBpm;
            tempoVal.innerText = `${pct}%`;
            tempoBpmVal.innerText = `${newBpm} bpm`;
        }

        tempoPlus.onclick = () => {
            let pct = parseInt(tempoVal.innerText) + 5;
            updateTempo(pct);
        };

        tempoMinus.onclick = () => {
            let pct = Math.max(10, parseInt(tempoVal.innerText) - 5);
            updateTempo(pct);
        };

        // Robust Seek Logic
        function startSeeking() {
            isUserSeeking = true;
            lastSeekTime = Date.now();
        }

        function stopSeeking() {
            lastSeekTime = Date.now();
            // Delay before letting setInterval take over again
            setTimeout(() => {
                isUserSeeking = false;
            }, 500);
        }

        progressBar.addEventListener('pointerdown', startSeeking);
        window.addEventListener('pointerup', () => {
            if (isUserSeeking) stopSeeking();
        });
        window.addEventListener('pointercancel', () => {
            if (isUserSeeking) stopSeeking();
        });

        // Volume Slider
        volumeSlider.addEventListener('input', () => {
            masterVolume = volumeSlider.value / 100;
        });

        progressBar.addEventListener('input', (e) => {
            if (player && player.totalTicks > 0) {
                startSeeking();
                const tick = (e.target.value / 1000) * player.totalTicks;
                player.skipToTick(tick);
                player.tick = tick;
                pendingNotes.clear();
                updatePendingDisplay();
                currentTimeEl.innerText = formatTime(tick * (player.getSongTime() / player.totalTicks));
            }
        });

        progressBar.addEventListener('change', (e) => {
            if (player && player.totalTicks > 0) {
                const tick = (e.target.value / 1000) * player.totalTicks;
                player.skipToTick(tick);
                player.tick = tick;
                stopSeeking();
            }
        });

        playPauseBtn.onclick = () => {
            if (player.isPlaying()) {
                player.pause();
                playPauseBtn.innerText = '▶';
            } else {
                player.play();
                playPauseBtn.innerText = '⏸';
            }
        };

        // Loop Drag Logic
        let activeHandle = null;
        let dragStartX = 0;
        let dragStartTicks = { start: 0, end: 0 };

        function updateLoopUI() {
            if (!player || player.totalTicks <= 0) return;

            const startPct = (loopStartTick === null) ? 0 : (loopStartTick / player.totalTicks);
            const endPct = (loopEndTick === null) ? 1 : (loopEndTick / player.totalTicks);

            loopHandleStart.style.display = 'block';
            loopHandleEnd.style.display = 'block';
            loopBox.style.display = 'block';

            // The progress-container has 6px padding on each side
            // The progress bar (input range) sits inside that padding
            // IMPORTANT: The slider thumb (12px wide) center travels from thumbRadius to (trackWidth - thumbRadius)
            // This means the effective travel distance is (trackWidth - thumbWidth)
            const containerRect = progressContainer.getBoundingClientRect();
            const padding = 6;
            const thumbWidth = 12;
            const thumbRadius = thumbWidth / 2;
            const trackWidth = containerRect.width - (padding * 2);

            // The thumb center starts at thumbRadius and ends at (trackWidth - thumbRadius)
            // So the usable range is (trackWidth - thumbWidth)
            const usableWidth = trackWidth - thumbWidth;

            // Calculate pixel positions - matching how browser positions the thumb center
            const startPx = padding + thumbRadius + (startPct * usableWidth);
            const endPx = padding + thumbRadius + (endPct * usableWidth);

            loopHandleStart.style.left = `${startPx}px`;
            loopHandleEnd.style.left = `${endPx}px`;

            loopBox.style.left = `${startPx}px`;
            loopBox.style.width = `${endPx - startPx}px`;

            // Sync with Staff View
            updateStaffLoopBars();
        }

        function handleLoopDrag(e) {
            if (!activeHandle || !player || player.totalTicks <= 0) return;

            const rect = progressContainer.getBoundingClientRect();
            // Match the positioning logic from updateLoopUI
            const padding = 6;
            const thumbWidth = 12;
            const thumbRadius = thumbWidth / 2;
            const trackWidth = rect.width - (padding * 2);
            const usableWidth = trackWidth - thumbWidth;

            if (activeHandle === 'box') {
                const deltaX = e.clientX - dragStartX;
                const deltaTicks = (deltaX / usableWidth) * player.totalTicks;

                let newStart = dragStartTicks.start + deltaTicks;
                let newEnd = dragStartTicks.end + deltaTicks;

                if (newStart < 0) {
                    newEnd -= newStart;
                    newStart = 0;
                }
                if (newEnd > player.totalTicks) {
                    newStart -= (newEnd - player.totalTicks);
                    newEnd = player.totalTicks;
                }

                loopStartTick = newStart;
                loopEndTick = newEnd;
            } else {
                // Mouse position relative to the usable track area
                const x = e.clientX - rect.left - padding - thumbRadius;
                let pct = x / usableWidth;
                pct = Math.max(0, Math.min(1, pct));
                const tick = pct * player.totalTicks;

                if (activeHandle === 'start') {
                    loopStartTick = Math.min(tick, loopEndTick !== null ? loopEndTick - 100 : player.totalTicks);
                } else if (activeHandle === 'end') {
                    loopEndTick = Math.max(tick, loopStartTick !== null ? loopStartTick + 100 : 0);
                }
            }

            updateLoopUI();
        }

        loopHandleStart.onpointerdown = (e) => {
            activeHandle = 'start';
            e.stopPropagation();
            e.preventDefault();
        };
        loopHandleEnd.onpointerdown = (e) => {
            activeHandle = 'end';
            e.stopPropagation();
            e.preventDefault();
        };
        loopBox.onpointerdown = (e) => {
            activeHandle = 'box';
            dragStartX = e.clientX;
            dragStartTicks = { start: loopStartTick, end: loopEndTick };
            e.stopPropagation();
            e.preventDefault();
        };

        window.addEventListener('pointermove', handleLoopDrag);
        window.addEventListener('pointerup', () => activeHandle = null);

        // Vertical Scale
        const vScaleSlider = document.getElementById('v-scale-slider');
        // Force default value to middle on load to override browser cache
        vScaleSlider.value = 50;
        visualScale = 1.0;

        vScaleSlider.oninput = () => {
            // Mapping: 50 (middle) is default 1.0, 100 (top) is 2.0x, 1 (bottom) is 0.05x
            visualScale = vScaleSlider.value / 50;
            recalibrate();
        };

        // Initialize handles on load
        socket.on('song_loaded', () => {
            loopStartTick = 0;
            loopEndTick = player.totalTicks;
            updateLoopUI();
            if (isStaffView) {
                renderStaffNotation();
                renderClefOverlay();
                updateStaffLoopBars();
            }
        });

        // Add to existing player load logic if needed
        function onSongLoaded() {
            loopStartTick = 0;
            loopEndTick = player.totalTicks;
            updateLoopUI();
            if (isStaffView) {
                renderStaffNotation();
                renderClefOverlay();
                updateStaffLoopBars();
            }
        }

        waitBtn.onclick = () => {
            isWaitMode = !isWaitMode;
            waitBtn.classList.toggle('active', isWaitMode);

            if (!isWaitMode) {
                pendingNotes.clear();
                updatePendingDisplay();
                // Clear user buffer too
                recentUserNotes.clear();
                if (!player.isPlaying() && playPauseBtn.innerText === '⏸') {
                    player.play();
                }
            }
        };

        // Leeway Slider Logic
        const leewaySlider = document.getElementById('leeway-slider');
        const leewayValDisplay = document.getElementById('leeway-val');
        if (leewaySlider) {
            leewaySlider.addEventListener('input', (e) => {
                LEEWAY_MS = parseInt(e.target.value);
                leewayValDisplay.innerText = `${LEEWAY_MS}ms`;
            });
        }

        muteMidiBtn.onclick = () => {
            isMidiMuted = !isMidiMuted;
            muteMidiBtn.classList.toggle('active', isMidiMuted);
            muteMidiBtn.title = isMidiMuted ? 'Unmute MIDI File' : 'Mute MIDI File';
        };

        settingsBtn.onclick = () => midiInput.click();


        // Global Error Handler
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            const errorDiv = document.createElement('div');
            errorDiv.style.position = 'fixed';
            errorDiv.style.bottom = '10px';
            errorDiv.style.right = '10px';
            errorDiv.style.background = 'rgba(255, 0, 0, 0.8)';
            errorDiv.style.color = 'white';
            errorDiv.style.padding = '10px';
            errorDiv.style.borderRadius = '5px';
            errorDiv.style.zIndex = '10000';
            errorDiv.innerText = `Error: ${msg} (Line ${lineNo})`;
            document.body.appendChild(errorDiv);
            console.error('Global Error:', error);
            return false;
        };

        window.onunhandledrejection = function (event) {
            console.error("Unhandled Promise Rejection:", event.reason);
        };

        // Note Highlight Utility
        function updateKeyState(type, note, velocity, control, value, fromMidiFile = false) {
            try {
                if (!audioReady || !piano) return;

                const shouldPlaySound = !fromMidiFile || !isMidiMuted;

                if (type === 'note_on' && velocity > 0) {
                    if (keysMap[note]) keysMap[note].classList.add('active');
                    if (shouldPlaySound) {
                        if (activeNotes.has(note)) activeNotes.get(note).player.stop();
                        sustainedNotes.delete(note);
                        const p = piano.play(note, audioContext.currentTime, { gain: (velocity / 127) * masterVolume });
                        activeNotes.set(note, { player: p });
                    }
                    if (note >= 0 && note < notes.length * 12) {
                        noteDisplay.innerText = notes[note % 12] + (Math.floor(note / 12) - 1);
                    }
                } else if (type === 'note_off' || (type === 'note_on' && velocity === 0)) {
                    if (keysMap[note]) keysMap[note].classList.remove('active');
                    if (shouldPlaySound) {
                        if (isSustainActive) {
                            sustainedNotes.add(note);
                        } else if (activeNotes.has(note)) {
                            activeNotes.get(note).player.stop();
                            activeNotes.delete(note);
                        }
                    }
                } else if (type === 'control_change' && control === 64) {
                    isSustainActive = value >= 64;
                    if (!isSustainActive && shouldPlaySound) {
                        sustainedNotes.forEach(n => {
                            if (activeNotes.has(n)) {
                                activeNotes.get(n).player.stop();
                                activeNotes.delete(n);
                            }
                        });
                        sustainedNotes.clear();
                    }
                }
            } catch (err) {
                console.warn(`Error in updateKeyState: ${err.message}`, { type, note });
            }
        }

        socket.on('connect', () => {
            console.log('Connected to server');
            status.innerText = 'Connected - MIDI Ready';
            status.style.color = '#00ffcc';
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            status.innerText = 'Connection Lost';
            status.style.color = '#ff4444';
        });

        socket.on('midi_event', (data) => {
            if (isWaitMode && data.type === 'note_on' && data.velocity > 0) {
                const now = Date.now();
                // 1. Check if this satisfies a pending note
                if (pendingNotes.has(data.note)) {
                    pendingNotes.delete(data.note);
                    updatePendingDisplay();
                    if (pendingNotes.size === 0) {
                        // If we were paused, resume
                        if (!player.isPlaying()) {
                            player.play();
                            playPauseBtn.innerText = '⏸';
                        }
                    }
                } else {
                    // 2. Note not pending yet? Store it in buffer for "Leeway Before"
                    recentUserNotes.set(data.note, now);

                    // Cleanup old notes (older than LEEWAY_MS + some margin)
                    for (const [note, time] of recentUserNotes) {
                        if (now - time > (LEEWAY_MS + 200)) {
                            recentUserNotes.delete(note);
                        }
                    }
                }
            }
            updateKeyState(data.type, data.note, data.velocity, data.control, data.value);
        });

        // Click to Select
        dropHint.addEventListener('click', (e) => {
            midiInput.click();
        });
        midiInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        // Drag & Drop
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            document.body.classList.add('dragging');
        });
        window.addEventListener('dragleave', (e) => {
            // Only remove if we're actually leaving the window
            if (e.relatedTarget === null) document.body.classList.remove('dragging');
        });
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            console.log('File dropped');
            document.body.classList.remove('dragging');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            console.log('Handling file:', file.name);
            if (file.name.toLowerCase().endsWith('.mid') || file.name.toLowerCase().endsWith('.midi')) {
                status.innerText = file.name;
                const reader = new FileReader();
                reader.onload = (event) => {
                    loadMIDI(event.target.result);
                };
                reader.readAsArrayBuffer(file);
            } else {
                alert('Please select a valid MIDI file (.mid or .midi)');
            }
        }

        function loadMIDI(arrayBuffer) {
            player.stop();
            player.loadArrayBuffer(arrayBuffer);

            // Calibrate Ticks per Pixel (approximate 2 seconds view)
            recalibrate();

            // Manual calc of max ticks to verify
            let maxTick = 0;
            player.events.forEach(track => {
                track.forEach(event => {
                    if (event.tick > maxTick) maxTick = event.tick;
                });
            });
            console.log(`MIDI Loaded. Player Ticks: ${player.totalTicks}, Manual Max: ${maxTick}`);

            // Fix potential truncation
            if (maxTick > player.totalTicks) {
                console.warn("Correcting totalTicks!");
                player.totalTicks = maxTick;
            }

            // Extract notes for visualization
            fallingNotes = [];

            player.events.forEach(track => {
                const ongoingNotes = {};
                track.forEach(event => {
                    if (event.name === 'Note on' && event.velocity > 0) {
                        ongoingNotes[event.noteNumber] = { startTick: event.tick, vel: event.velocity };
                    } else if ((event.name === 'Note on' && event.velocity === 0) || event.name === 'Note off') {
                        if (ongoingNotes[event.noteNumber]) {
                            fallingNotes.push({
                                note: event.noteNumber,
                                startTick: ongoingNotes[event.noteNumber].startTick,
                                endTick: event.tick,
                                vel: ongoingNotes[event.noteNumber].vel
                            });
                            delete ongoingNotes[event.noteNumber];
                        }
                    }
                });
            });

            status.innerText = 'MIDI Loaded';
            document.getElementById('drop-hint').style.display = 'none';
            player._baseTempo = player.tempo;
            updateTempo(100);

            // Initialize loop points to full song
            loopStartTick = 0;
            loopEndTick = player.totalTicks;

            console.log(`MIDI Loaded. Total Ticks: ${player.totalTicks}`);

            updateLoopUI();

            // Re-render staff if currently in staff view
            if (isStaffView) {
                renderStaffNotation();
                renderClefOverlay();
            }

            player.play();
            playPauseBtn.innerText = '⏸';
        }

        // Animation Loop
        function animate() {
            // Request next frame first to keep loop running even if render fails
            requestAnimationFrame(animate);

            try {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (player && player.totalTicks > 0) {
                    const currentTick = player.tick;

                    // High-precision Loop Check
                    if (player.isPlaying() && loopEndTick !== null && currentTick >= loopEndTick) {
                        player.skipToTick(loopStartTick || 0);
                        player.play();
                        return;
                    }

                    fallingNotes.forEach(n => {
                        const key = keysMap[n.note];
                        if (!key) return;

                        const rect = key.getBoundingClientRect();
                        const canvasRect = canvas.getBoundingClientRect();
                        const x = rect.left - canvasRect.left;
                        const width = rect.width;

                        const tickDelta = n.startTick - currentTick;
                        const durationTicks = n.endTick - n.startTick;

                        const y = canvas.height - (tickDelta / (TICKS_PER_PIXEL / visualScale));
                        const h = durationTicks / (TICKS_PER_PIXEL / visualScale);

                        if (y > -200 && (y - h) < canvas.height + 200) {
                            ctx.fillStyle = notes[n.note % 12].includes('#') ? '#00ccaa' : '#00ffcc';
                            ctx.globalAlpha = 0.7;
                            ctx.beginPath();
                            ctx.roundRect(x + 2, y - h, width - 4, Math.max(4, h - 2), 4);
                            ctx.fill();

                            if (y >= canvas.height && (y - h) <= canvas.height) {
                                ctx.shadowBlur = 15;
                                ctx.shadowColor = '#00ffcc';
                                ctx.fillRect(x + 2, canvas.height - 2, width - 4, 2);
                                ctx.shadowBlur = 0;
                            }
                        }
                    });

                    // Smooth Staff Scrolling
                    if (isStaffView) {
                        updateStaffPlayhead();
                    }
                }
            } catch (err) {
                console.warn("Animate Error:", err);
            }
        }
        animate();

        // Pointer Support for Keyboard
        let isPointerDownGlobals = false;
        window.addEventListener('pointerdown', () => isPointerDownGlobals = true);
        window.addEventListener('pointerup', () => isPointerDownGlobals = false);

        keyboard.addEventListener('pointerdown', (e) => {
            if (e.target.classList.contains('key')) {
                const note = parseInt(e.target.dataset.note);
                updateKeyState('note_on', note, 100);
                socket.emit('ui_midi_event', { type: 'note_on', note: note, velocity: 100 });
                e.target.releasePointerCapture(e.pointerId); // Don't block other events
            }
        });

        keyboard.addEventListener('pointerover', (e) => {
            if (isPointerDownGlobals && e.target.classList.contains('key')) {
                const note = parseInt(e.target.dataset.note);
                updateKeyState('note_on', note, 100);
                socket.emit('ui_midi_event', { type: 'note_on', note: note, velocity: 100 });
            }
        });

        keyboard.addEventListener('pointerup', (e) => {
            if (e.target.classList.contains('key')) {
                const note = parseInt(e.target.dataset.note);
                updateKeyState('note_off', note, 0);
                socket.emit('ui_midi_event', { type: 'note_off', note: note, velocity: 0 });
            }
        });

        keyboard.addEventListener('pointerout', (e) => {
            if (isPointerDownGlobals && e.target.classList.contains('key')) {
                const note = parseInt(e.target.dataset.note);
                updateKeyState('note_off', note, 0);
                socket.emit('ui_midi_event', { type: 'note_off', note: note, velocity: 0 });
            }
        });

        // ---------------------------------------------------------
        // Blender-style Infinite Scroll for Tempo
        // ---------------------------------------------------------
        const tempoDisplay = document.querySelector('.tempo-display');
        let isDraggingTempo = false;

        tempoDisplay.style.cursor = 'ew-resize';
        tempoDisplay.title = "Drag left/right to adjust tempo";

        tempoDisplay.addEventListener('mousedown', async (e) => {
            isDraggingTempo = true;
            try {
                // Request pointer lock for infinite scrolling experience
                await tempoDisplay.requestPointerLock();
            } catch (err) {
                console.warn("Pointer lock failed:", err);
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isDraggingTempo) {
                // Use movementX for relative motion
                const delta = e.movementX;

                // Sensitivity
                const sensitivity = e.shiftKey ? 0.2 : 1;

                let newPct = currentTempoPct + (delta * sensitivity);

                // Clamp
                newPct = Math.max(10, Math.min(400, newPct));

                updateTempo(Math.round(newPct));
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDraggingTempo) {
                isDraggingTempo = false;
                document.exitPointerLock();
            }
        });

        // Spacebar to Resume/Skip
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && isWaitMode) {
                e.preventDefault();
                if (pendingNotes.size > 0 || !player.isPlaying()) {
                    pendingNotes.clear();
                    updatePendingDisplay();
                    player.play();
                    playPauseBtn.innerText = '⏸';
                } else {
                    player.pause();
                    playPauseBtn.innerText = '▶';
                }
            }
        });

        // ---------------------------------------------------------
        // Staff Notation View (VexFlow)
        // ---------------------------------------------------------
        const staffContainer = document.getElementById('staff-container');
        const staffScrollArea = document.getElementById('staff-scroll-area');
        const viewToggleBtn = document.getElementById('view-toggle-btn');
        const clefOverlay = document.getElementById('clef-overlay');
        const staffLoopStart = document.getElementById('staff-loop-start');
        const staffLoopEnd = document.getElementById('staff-loop-end');
        let isStaffView = false;
        let staffRenderer = null;
        let staffContext = null;
        let staffPlayhead = null;
        let clefRenderer = null;
        const STAFF_WIDTH = 500; // Wider measures for better spacing
        const NOTES_PER_MEASURE = 16;

        // Convert MIDI note number to VexFlow note name
        function midiToVexNote(midiNote) {
            const noteNames = ['c', 'c#', 'd', 'd#', 'e', 'f', 'f#', 'g', 'g#', 'a', 'a#', 'b'];
            const octave = Math.floor(midiNote / 12) - 1;
            const noteName = noteNames[midiNote % 12];
            // VexFlow format: "c/4" or "c#/4"
            return `${noteName}/${octave}`;
        }

        // Determine clef based on note (middle C = 60)
        function getClefForNote(midiNote) {
            return midiNote >= 60 ? 'treble' : 'bass';
        }

        // Create the staff notation view
        function renderStaffNotation() {
            console.log('renderStaffNotation called, fallingNotes:', fallingNotes.length);

            if (!player || !fallingNotes || fallingNotes.length === 0) {
                staffScrollArea.innerHTML = '<p style="color: #666; text-align: center; padding: 50px;">Load a MIDI file to see staff notation</p>';
                return;
            }

            // Clear previous content
            staffScrollArea.innerHTML = '';

            // Check if VexFlow is loaded
            if (typeof Vex === 'undefined') {
                staffScrollArea.innerHTML = '<p style="color: #ff5555; text-align: center; padding: 50px;">VexFlow library failed to load</p>';
                return;
            }

            const VF = Vex.Flow;

            // Calculate total measures based on ticks
            const ticksPerMeasure = player.division * 4; // 4 beats per measure
            const totalMeasures = Math.ceil(player.totalTicks / ticksPerMeasure) + 1;
            const totalWidth = Math.max(staffContainer.clientWidth, totalMeasures * STAFF_WIDTH + 100);

            // Create SVG renderer
            staffRenderer = new VF.Renderer(staffScrollArea, VF.Renderer.Backends.SVG);
            staffRenderer.resize(totalWidth, 450); // Taller SVG
            staffContext = staffRenderer.getContext();
            staffContext.setFont('Arial', 10);

            // Group notes by measure AND tick (to handle chords)
            const measureNotes = {};
            console.log('Total falling notes:', fallingNotes.length);
            console.log('Ticks per measure:', ticksPerMeasure);

            fallingNotes.forEach(note => {
                const measureIndex = Math.floor(note.startTick / ticksPerMeasure);
                if (!measureNotes[measureIndex]) {
                    measureNotes[measureIndex] = { treble: {}, bass: {} };
                }
                const clef = getClefForNote(note.note);
                if (!measureNotes[measureIndex][clef][note.startTick]) {
                    measureNotes[measureIndex][clef][note.startTick] = [];
                }
                measureNotes[measureIndex][clef][note.startTick].push({
                    vexNote: midiToVexNote(note.note),
                    midiNote: note.note
                });
            });

            console.log('Measure notes grouped:', Object.keys(measureNotes).length, 'measures');

            // Render measures
            for (let m = 0; m < totalMeasures; m++) {
                const xOffset = 60 + m * STAFF_WIDTH;

                // Treble stave
                const trebleStave = new VF.Stave(xOffset, 40, STAFF_WIDTH - 10);
                if (m === 0) {
                    trebleStave.addClef('treble').addTimeSignature('4/4');
                }
                trebleStave.setContext(staffContext).draw();

                // Bass stave
                const bassStave = new VF.Stave(xOffset, 200, STAFF_WIDTH - 10);
                if (m === 0) {
                    bassStave.addClef('bass').addTimeSignature('4/4');
                }
                bassStave.setContext(staffContext).draw();

                // Connect staves with brace for first measure
                if (m === 0) {
                    const brace = new VF.StaveConnector(trebleStave, bassStave);
                    brace.setType(VF.StaveConnector.type.BRACE);
                    brace.setContext(staffContext).draw();

                    const lineLeft = new VF.StaveConnector(trebleStave, bassStave);
                    lineLeft.setType(VF.StaveConnector.type.SINGLE_LEFT);
                    lineLeft.setContext(staffContext).draw();
                }

                // Get notes for this measure
                const mNotes = measureNotes[m];
                if (mNotes) {
                    // Render treble chords
                    const trebleTicks = Object.keys(mNotes.treble).sort((a, b) => a - b);
                    if (trebleTicks.length > 0) {
                        try {
                            const trebleVexNotes = trebleTicks.map(tick => {
                                const notesAtTick = mNotes.treble[tick];
                                const keys = notesAtTick.map(n => n.vexNote);
                                const staveNote = new VF.StaveNote({
                                    clef: 'treble',
                                    keys: keys,
                                    duration: 'q'
                                });
                                // Add accidentals for each key in the chord
                                notesAtTick.forEach((n, i) => {
                                    if (n.vexNote.includes('#')) {
                                        staveNote.addModifier(new VF.Accidental('#'), i);
                                    }
                                });
                                return staveNote;
                            });

                            const voice = new VF.Voice({ num_beats: trebleVexNotes.length, beat_value: 4 });
                            voice.setStrict(false);
                            voice.addTickables(trebleVexNotes);
                            new VF.Formatter().joinVoices([voice]).format([voice], STAFF_WIDTH - 60);
                            voice.draw(staffContext, trebleStave);
                        } catch (e) {
                            console.warn('Treble render error measure ' + m, e);
                        }
                    }

                    // Render bass chords
                    const bassTicks = Object.keys(mNotes.bass).sort((a, b) => a - b);
                    if (bassTicks.length > 0) {
                        try {
                            const bassVexNotes = bassTicks.map(tick => {
                                const notesAtTick = mNotes.bass[tick];
                                const keys = notesAtTick.map(n => n.vexNote);
                                const staveNote = new VF.StaveNote({
                                    clef: 'bass',
                                    keys: keys,
                                    duration: 'q'
                                });
                                notesAtTick.forEach((n, i) => {
                                    if (n.vexNote.includes('#')) {
                                        staveNote.addModifier(new VF.Accidental('#'), i);
                                    }
                                });
                                return staveNote;
                            });

                            const voice = new VF.Voice({ num_beats: bassVexNotes.length, beat_value: 4 });
                            voice.setStrict(false);
                            voice.addTickables(bassVexNotes);
                            new VF.Formatter().joinVoices([voice]).format([voice], STAFF_WIDTH - 60);
                            voice.draw(staffContext, bassStave);
                        } catch (e) {
                            console.warn('Bass render error measure ' + m, e);
                        }
                    }
                }
            }

            // Refs for playhead
            staffPlayhead = document.getElementById('staff-playhead-v2');
            if (staffPlayhead) staffPlayhead.style.display = 'block';

            // Initial loop bars update
            updateStaffLoopBars();
        }

        // Render fixed clef overlay
        function renderClefOverlay() {
            if (!clefOverlay) return;
            clefOverlay.innerHTML = '';

            const VF = Vex.Flow;
            clefRenderer = new VF.Renderer(clefOverlay, VF.Renderer.Backends.SVG);
            clefRenderer.resize(80, 280);
            const context = clefRenderer.getContext();

            const trebleStave = new VF.Stave(0, 40, 80);
            trebleStave.addClef('treble').addTimeSignature('4/4');
            trebleStave.setContext(context).draw();

            const bassStave = new VF.Stave(0, 200, 80);
            bassStave.addClef('bass').addTimeSignature('4/4');
            bassStave.setContext(context).draw();

            const brace = new VF.StaveConnector(trebleStave, bassStave);
            brace.setType(VF.StaveConnector.type.BRACE);
            brace.setContext(context).draw();
        }

        // Update loop bars on staff
        function updateStaffLoopBars() {
            if (!isStaffView || !player || player.totalTicks <= 0) return;

            const ticksPerMeasure = player.division * 4;

            if (loopStartTick !== null) {
                const startPos = 60 + (loopStartTick / ticksPerMeasure) * STAFF_WIDTH;
                staffLoopStart.style.left = startPos + 'px';
                staffLoopStart.style.display = 'block';
                // Move with scroll area
                staffLoopStart.style.transform = `translateX(${lastStaffScrollX}px)`;
            } else {
                staffLoopStart.style.display = 'none';
            }

            if (loopEndTick !== null) {
                const endPos = 60 + (loopEndTick / ticksPerMeasure) * STAFF_WIDTH;
                staffLoopEnd.style.left = endPos + 'px';
                staffLoopEnd.style.display = 'block';
                // Move with scroll area
                staffLoopEnd.style.transform = `translateX(${lastStaffScrollX}px)`;
            } else {
                staffLoopEnd.style.display = 'none';
            }
        }

        // Update playhead position and centered scroll
        let lastStaffScrollX = 0;
        function updateStaffPlayhead() {
            if (!isStaffView || !player || player.totalTicks <= 0) return;

            const ticksPerMeasure = player.division * 4;
            const currentMeasure = player.tick / ticksPerMeasure;
            const xPos = 60 + currentMeasure * STAFF_WIDTH;

            // In centered mode, the playhead stays at centerX
            const containerWidth = staffContainer.clientWidth;
            const centerX = containerWidth / 2;

            // Calculate scroll amount
            const scrollX = centerX - xPos;
            lastStaffScrollX = scrollX;

            // Apply transform for smooth scrolling
            staffScrollArea.style.transform = `translateX(${scrollX}px)`;

            // Loop bars also need to follow the scroll
            if (staffLoopStart) staffLoopStart.style.transform = `translateX(${scrollX}px)`;
            if (staffLoopEnd) staffLoopEnd.style.transform = `translateX(${scrollX}px)`;
        }

        // Toggle view
        viewToggleBtn.onclick = () => {
            isStaffView = !isStaffView;

            if (isStaffView) {
                // Hide canvas but keep space (or hide if container handles it)
                canvas.classList.add('hidden');
                canvas.style.display = 'none';
                staffContainer.classList.remove('hidden');
                clefOverlay.classList.remove('hidden');
                viewToggleBtn.innerText = '🎼';
                viewToggleBtn.classList.add('staff-active');
                viewToggleBtn.title = 'Switch to Falling Notes';
                renderStaffNotation();
                renderClefOverlay();
            } else {
                canvas.classList.remove('hidden');
                canvas.style.display = 'block';
                staffContainer.classList.add('hidden');
                clefOverlay.classList.add('hidden');
                if (staffPlayhead) staffPlayhead.style.display = 'none';
                viewToggleBtn.innerText = '🎹';
                viewToggleBtn.classList.remove('staff-active');
                viewToggleBtn.title = 'Switch to Staff View';
            }
        };

        // Update staff playhead in animation loop
        const originalAnimate = animate;
        function animateWithStaff() {
            originalAnimate();
            if (isStaffView && player && player.isPlaying()) {
                updateStaffPlayhead();
            }
        }

        // Override animation - add staff playhead update to main loop
        setInterval(() => {
            if (isStaffView && player && player.totalTicks > 0) {
                updateStaffPlayhead();
            }
        }, 50);

        // Re-render staff when MIDI is loaded
        const originalLoadMIDI = loadMIDI;
        loadMIDI = function (arrayBuffer) {
            originalLoadMIDI(arrayBuffer);
            if (isStaffView) {
                setTimeout(renderStaffNotation, 100);
            }
        };
    </script>
</body>
